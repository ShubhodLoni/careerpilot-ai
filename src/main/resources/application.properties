spring.application.name=careerpilot-AI

# ============================================
# Server Configuration
# ============================================
server.port=8080

# ============================================
# MySQL Database Configuration
# ============================================
# Uncomment and configure these when your MySQL database is ready:
# spring.datasource.url=jdbc:mysql://localhost:3306/careerpilot_db
# spring.datasource.username=root
# spring.datasource.password=your_password
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================================
# Temporarily exclude JPA auto-configuration
# (remove this line once MySQL is configured)
# ============================================
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
